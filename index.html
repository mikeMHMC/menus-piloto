<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>CGS • Menús</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <style>
    /* ---- Estilos base (piloto). Más tarde te maqueto igual que tus pantallas ---- */
    :root{
      --bg:#f5f7f9; --card:#fff; --ink:#0e1116; --muted:#5f6b7a;
      --accent:#06a7a7; --rule:#e7eaf0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:16px 24px;background:var(--accent);color:#fff}
    header h1{margin:0;font-size:20px;letter-spacing:.3px}
    header .sub{opacity:.9;font-size:13px}
    main{max-width:1280px;margin:auto;padding:22px}
    .layout{display:grid;grid-template-columns:2fr 1fr;gap:24px}
    .card{background:var(--card);border-radius:10px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    h2{margin:0 0 10px 0;font-size:18px}
    h3{margin:22px 0 8px 0;font-size:15px;letter-spacing:.2px}
    .rule{height:1px;background:var(--rule);margin:16px 0}
    .muted{color:var(--muted)}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .item{margin-bottom:10px}
    .dish{font-weight:600}
    .desc{color:var(--muted);font-size:13px;line-height:1.3}
    .tags{margin-top:6px}
    .pill{display:inline-block;background:#eef2f7;color:#2b3a4c;border-radius:999px;padding:2px 8px;font-size:12px;margin:0 6px 6px 0}
    .alert{padding:8px 10px;border-radius:8px;background:#fff6e6;border:1px solid #ffe1a3;color:#6b4e00;font-size:13px}
    .right h2{margin-top:0}
    .kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef2f7;border:1px solid #d8e0ea;padding:1px 6px;border-radius:4px;font-size:12px}
    @media (max-width:980px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1 id="hdrTitle">Menú</h1>
    <div id="hdrSub" class="sub"></div>
  </header>

  <main>
    <div class="layout">
      <!-- Columna izquierda: contenido del menú -->
      <section id="menu" class="card">
        Cargando…
      </section>

      <!-- Columna derecha: alérgenos (placeholder para el piloto) -->
      <aside class="card right">
        <h2>Alérgenos y trazas</h2>
        <div id="alergenos" class="muted">
          (Aquí pondremos tus iconos oficiales. De momento, etiquetas de ejemplo.)
          <div class="rule"></div>
          <div class="tags">
            <span class="pill">Gluten</span>
            <span class="pill">Huevo</span>
            <span class="pill">Lácteos</span>
            <span class="pill">Frutos secos</span>
            <span class="pill">Soja</span>
            <span class="pill">Moluscos</span>
          </div>
        </div>
        <div style="margin-top:14px" class="muted">
          Consejo: si vas a presentar en pantallas, usa <span class="kbd">F11</span> para modo pantalla completa.
        </div>
      </aside>
    </div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
